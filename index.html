<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#171933">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ElizAstro">
  <meta name="description" content="Your personal celestial companion. Natal charts, transits, and synastry, all on-device.">

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/sagittarius.png">
  <link rel="stylesheet" href="css/style.css">

  <title>ElizAstro</title>
</head>
<body>
  <div id="app">
    <div id="app-content"></div>
  </div>

  <!-- Tab Bar -->
  <nav class="tab-bar" id="tab-bar" style="display:none;">
    <button class="tab-bar-item active" data-view="home">
      <svg viewBox="0 0 24 24"><path d="M3 12l9-9 9 9M5 10v10a1 1 0 001 1h3a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1h3a1 1 0 001-1V10" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Home</span>
    </button>
    <button class="tab-bar-item" data-view="chart">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><line x1="12" y1="3" x2="12" y2="7"/><line x1="12" y1="17" x2="12" y2="21"/><line x1="3" y1="12" x2="7" y2="12"/><line x1="17" y1="12" x2="21" y2="12"/></svg>
      <span>My Chart</span>
    </button>
    <button class="tab-bar-item" data-view="friends">
      <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8zM23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Friends</span>
    </button>
    <button class="tab-bar-item" data-view="synastry">
      <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Synastry</span>
    </button>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
